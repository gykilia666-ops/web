<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Задание 2 — вариант 5</title>
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/style-2.css">
</head>
<body>
<div class="layout" aria-label="Адаптивный макет, вариант 5">
    <div class="header">
        <div class="cell cell-10" data-block="10"><div class="tile">#CD5C5C</div></div>
        <div class="cell cell-11" data-block="11"><div class="tile">#DC143C</div></div>
        <div class="cell cell-12" data-block="12"><div class="tile">#8B0000</div></div>
    </div>
    <div class="pink">
        <div class="pink-stack">
            <div class="cell cell-20" data-block="20"><div class="tile">#FFC0CB</div></div>
            <div class="cell cell-21" data-block="21"><div class="tile">#FF69B4</div></div>
        </div>
        <div class="cell cell-22" data-block="22"><div class="tile">#C71585</div></div>
    </div>
    <div class="green">
        <div class="green-main">
            <div class="green-row"><div class="cell cell-32" data-block="32"><div class="tile">#32CD32</div></div><div class="cell cell-33" data-block="33"><div class="tile">#00FA9A</div></div></div>
            <div class="green-row"><div class="cell cell-34" data-block="34"><div class="tile">#2E8B57</div></div><div class="cell cell-35" data-block="35"><div class="tile">#006400</div></div></div>
            <div class="green-row"><div class="cell cell-36" data-block="36"><div class="tile">#9ACD32</div></div><div class="cell cell-37" data-block="37"><div class="tile">#808000</div></div></div>
        </div>
        <div class="green-side">
            <div class="cell cell-30" data-block="30"><div class="tile">#ADFF2F</div></div>
            <div class="cell cell-31" data-block="31"><div class="tile">#00FF00</div></div>
        </div>
    </div>
    <div class="orange">
        <div class="orange-slot"><div class="cell cell-50" data-block="50"><div class="tile">#FFA07A</div></div></div>
        <div class="orange-slot"><div class="cell cell-51" data-block="51"><div class="tile">#FF4500</div></div></div>
        <div class="orange-slot"><div class="cell cell-52" data-block="52"><div class="tile">#FFA500</div></div></div>
    </div>
    <div class="brown">
        <div class="cell cell-60" data-block="60"><div class="tile">#BC8F8F</div></div>
        <div class="cell cell-61" data-block="61"><div class="tile">#F4A460</div></div>
        <div class="cell cell-62" data-block="62"><div class="tile">#D2691E</div></div>
        <div class="brown-right">
            <div class="cell cell-63" data-block="63"><div class="tile">#8B4513</div></div>
            <div class="brown-tail"><div class="cell cell-64" data-block="64"><div class="tile">#A52A2A</div></div><div class="cell cell-65" data-block="65"><div class="tile">#800000</div></div></div>
        </div>
    </div>
</div>
</body>
</html>
