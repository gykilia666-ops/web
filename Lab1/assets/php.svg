<svg xmlns="http://www.w3.org/2000/svg"
     width="480" height="300" viewBox="0 0 480 300"
     role="img" aria-labelledby="title description">
  <title id="title">PHP — серверный язык</title>
  <desc id="description">
    Надпись PHP на фиолетовом фоне и пример команды echo.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343e69"/>
      <stop offset="1" stop-color="#747ec0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" rx="18" fill="url(#background)"/>

  <circle cx="440" cy="34" r="90" fill="#ffffff" opacity=".06"/>
  <circle cx="36" cy="284" r="112" fill="#ffffff" opacity=".06"/>

  <text x="240" y="142"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="100" font-weight="bold"
        font-style="italic" fill="#ffffff">PHP</text>

  <text x="240" y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17" fill="#e3e8ff">Hypertext Preprocessor</text>

  <rect x="47" y="208" width="386" height="52"
        rx="8" fill="#1d263a"/>

  <text x="240" y="241"
        text-anchor="middle"
        font-family="monospace" font-size="18"
        fill="#a6d890">echo "Hello, web!";</text>
</svg>